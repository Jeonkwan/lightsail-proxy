name: AWS Create S3 Bucket

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Name of the S3 bucket to create (must be globally unique)"
        required: true
        type: string
      country:
        description: "Country for S3 Bucket Placement"
        required: true
        default: "Singapore"
        type: choice
        options:
          - Singapore
          - Japan
          - Korea
          - India
          - Hong Kong
          - Indonesia

jobs:
  create-bucket:
    name: "Create S3 Bucket [${{ github.event.inputs.bucket_name }}] in [${{ github.event.inputs.country }}]"
    runs-on: ubuntu-latest
    environment: prod-basic
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Validate Bucket Name
        run: |
          BUCKET_NAME="${{ github.event.inputs.bucket_name }}"
          if [[ -z "$BUCKET_NAME" ]]; then
            echo "Error: bucket_name cannot be empty."
            exit 1
          fi

      - name: Resolve AWS Region from Country
        run: |
          COUNTRY="${{ github.event.inputs.country || 'Singapore' }}"
          case "$COUNTRY" in
            "Singapore") REGION="ap-southeast-1" ;;
            "Japan") REGION="ap-northeast-1" ;;
            "Korea") REGION="ap-northeast-2" ;;
            "India") REGION="ap-south-1" ;;
            "Hong Kong") REGION="ap-east-1" ;;
            "Indonesia") REGION="ap-southeast-3" ;;
            *) REGION="ap-southeast-1" ;;
          esac
          echo "AWS_DEFAULT_REGION=$REGION" >> "$GITHUB_ENV"
          echo "Resolved $COUNTRY to region $REGION"

      - name: Check and Create S3 Bucket
        run: |
          BUCKET_NAME="${{ github.event.inputs.bucket_name }}"
          REGION="$AWS_DEFAULT_REGION"
          
          echo "Checking if S3 bucket '$BUCKET_NAME' exists..."
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket '$BUCKET_NAME' does not exist. Creating it in region '$REGION'..."
            
            if [[ "$REGION" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            
            echo "Enabling versioning on bucket '$BUCKET_NAME'..."
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
              
            echo "Enabling server-side encryption on bucket '$BUCKET_NAME'..."
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
              
            echo "Successfully created S3 bucket '$BUCKET_NAME' in '$REGION'."
          else
            echo "S3 bucket '$BUCKET_NAME' already exists."
          fi
