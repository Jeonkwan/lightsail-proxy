name: Destroy and clean up Flat White
jobs:
  deploy:
    name: Guarded Flat White retirement
    runs-on: ubuntu-latest
    environment: prod-basic
    env:
      TF_WORKSPACE: flatwhite
      TF_ACTION: destroy
      TF_PLAN_DIR: artifacts/terraform
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.TF_BACKEND_REGION || 'ap-southeast-1' }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_aws_profile: default
      TF_VAR_aws_conf_file_path: ~/.aws/config
      TF_VAR_aws_cred_file_path: ~/.aws/credentials
      TF_VAR_ssh_public_key_path: ~/.ssh/jeonkwan-mbp.pub
      TF_VAR_ssh_private_key_path: ~/.ssh/jeonkwan-mbp
      TF_VAR_instance_customizable_name: flatwhite
      TF_VAR_subdomain_name: flatwhite
      TF_VAR_selected_country: singapore
      TF_VAR_selected_zone: a
      TF_VAR_domain_name: mokamaker.site
      TF_VAR_proxy_solution: basic-vm
      TF_VAR_proxy_contact_email: ''
      TF_VAR_playbook_branch: main
      TF_VAR_namecheap_ddns_password: ${{ secrets.NAMECHEAP_DDNS_PASS }}
      TF_VAR_proxy_server_uuid: 00000000-0000-4000-8000-000000000000
      TF_VAR_less_vision_reality_short_ids: ${{ secrets.LESS_VISION_REALITY_SHORT_IDS
        || '[]' }}
      TF_VAR_less_vision_reality_private_key: ${{ secrets.LESS_VISION_REALITY_PRIVATE_KEY
        || '' }}
      TF_VAR_less_vision_reality_public_key: ${{ secrets.LESS_VISION_REALITY_PUBLIC_KEY
        || '' }}
      TF_VAR_less_vision_reality_decoy_domain: ${{ secrets.LESS_VISION_REALITY_DECOY_DOMAIN
        || 'web.wechat.com' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || 'ap-southeast-1' }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6
    - name: Bootstrap credentials and backend
      env:
        VARS_CONTEXT: ${{ toJSON(vars) }}
      run: 'chmod +x scripts/deploy-basic/*.sh

        scripts/deploy-basic/bootstrap-env.sh

        '
    - name: Fix exact retirement workspace after bootstrap
      run: 'cat >> "$GITHUB_ENV" <<''CONFIG''

        TF_WORKSPACE=flatwhite

        TF_VAR_instance_customizable_name=flatwhite

        TF_VAR_subdomain_name=flatwhite

        TF_VAR_selected_country=singapore

        TF_VAR_selected_zone=a

        TF_VAR_domain_name=mokamaker.site

        TF_VAR_proxy_solution=basic-vm

        CONFIG

        '
    - name: Verify target and preserve survivors
      run: python3 scripts/operations/retire-flatwhite-guard.py before
    - name: Plan destruction in existing workspace only
      run: 'set -euo pipefail

        unset TF_WORKSPACE

        terraform init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="key=$TF_BACKEND_KEY"
        -backend-config="region=$TF_BACKEND_REGION"

        terraform workspace select flatwhite

        mkdir -p artifacts/terraform

        terraform plan -destroy -input=false -out=artifacts/terraform/retire.tfplan

        terraform show -json artifacts/terraform/retire.tfplan > artifacts/terraform/plan.json

        python3 scripts/operations/retire-flatwhite-guard.py plan

        '
    - name: Apply verified saved destruction plan
      run: terraform apply -input=false artifacts/terraform/retire.tfplan
    - name: Verify deletion, remove matching snapshots and empty workspace
      run: 'set -euo pipefail

        python3 scripts/operations/retire-flatwhite-guard.py after

        terraform show -json > artifacts/terraform/empty-state.json

        python3 - <<''CHECK''

        import json

        s=json.load(open(''artifacts/terraform/empty-state.json''))

        assert not s.get(''values'',{}).get(''root_module'',{}).get(''resources''),
        ''State is not empty''

        CHECK

        unset TF_WORKSPACE

        terraform workspace select default

        terraform workspace delete flatwhite

        '
    - name: Park retired DNS record
      env:
        DOMAIN: mokamaker.site
        SUBDOMAIN: flatwhite
        INSTANCE_PUBLIC_IP: 127.0.0.1
        NAMECHEAP_DDNS_PASS: ${{ secrets.NAMECHEAP_DDNS_PASS }}
      run: scripts/configure_namecheap_dns.sh
    - name: Publish cleanup summary
      run: 'cat >> "$GITHUB_STEP_SUMMARY" <<''SUMMARY''

        Flat White instance, static IP, key pair and Terraform resources were removed.

        Any Flat White instance snapshots were deleted. DNS is parked at 127.0.0.1.

        Cream and Decaf remain running at their expected IPs. Shared credentials and
        backends are retained.

        SUMMARY

        '
    timeout-minutes: 20
run-name: Retire Flat White; preserve Cream and Decaf
concurrency:
  group: flatwhite-retirement
  cancel-in-progress: false
'on':
  workflow_dispatch: {}
