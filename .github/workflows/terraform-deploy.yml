name: Recover Flat White through Lightsail API
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: lightsail-flatwhite-recovery
  cancel-in-progress: false
jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod-basic
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
    - name: Install AWS SDK
      run: python3 -m pip install boto3
    - name: Verify Flat White identity, inspect AWS health and recover
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport boto3,datetime,json,socket,time\n\
        client=boto3.client('lightsail',region_name='ap-southeast-1')\nname='lightsail-singapore-a-flatwhite-20261004070444'\n\
        expected_ip='54.251.241.201'\ninstance=client.get_instance(instanceName=name)['instance']\n\
        print('Instance:',instance['name'],'State:',instance['state']['name'],'IP:',instance.get('publicIpAddress'))\n\
        if instance['name']!=name or instance.get('publicIpAddress')!=expected_ip:\n\
        \    raise SystemExit('Instance identity/IP differs from verified flatwhite\
        \ deployment; refusing reboot.')\nif instance['state']['name']!='running':\n\
        \    raise SystemExit('Flat White is not running; refusing to perform an unexpected\
        \ start/stop operation.')\nprint('Instance status:',json.dumps(client.get_instance_state(instanceName=name)['state']))\n\
        try:\n    ports=client.get_instance_port_states(instanceName=name)['portStates']\n\
        \    print('Public firewall port states:',json.dumps(ports))\nexcept Exception\
        \ as e:\n    print('Firewall read unavailable:',type(e).__name__)\ntry:\n\
        \    end=datetime.datetime.now(datetime.timezone.utc)\n    metrics=client.get_instance_metric_data(instanceName=name,metricName='CPUUtilization',period=300,\n\
        \        startTime=end-datetime.timedelta(hours=24),endTime=end,unit='Percent',statistics=['Average','Maximum'])['metricData']\n\
        \    print('Recent CPU metrics:',json.dumps(metrics[-12:],default=str))\n\
        except Exception as e:\n    print('Metric read unavailable:',type(e).__name__)\n\
        for port in (22,443):\n    try:\n        with socket.create_connection((expected_ip,port),timeout=5):\
        \ pass\n        print('Before reboot TCP',port,'PASS')\n    except OSError\
        \ as e: print('Before reboot TCP',port,'FAIL',str(e))\nresult=client.reboot_instance(instanceName=name)\n\
        for operation in result['operations']:\n    print('Reboot operation:',operation['id'],operation['status'])\n\
        \    for attempt in range(60):\n        current=client.get_operation(operationId=operation['id'])['operation']\n\
        \        if current.get('isTerminal'):\n            print('Reboot terminal\
        \ result:',json.dumps(current,default=str))\n            if current['status']\
        \ not in ('Succeeded','Completed'):\n                raise SystemExit('AWS\
        \ reboot operation failed.')\n            break\n        time.sleep(2)\n \
        \   else: raise SystemExit('AWS reboot operation did not finish within two\
        \ minutes.')\ndeadline=time.monotonic()+600\ntime.sleep(15)\nwhile time.monotonic()<deadline:\n\
        \    results={}\n    for port in (22,443):\n        try:\n            with\
        \ socket.create_connection((expected_ip,port),timeout=3): pass\n         \
        \   results[port]=True\n        except OSError: results[port]=False\n    print('Post-reboot\
        \ TCP checks:',results,flush=True)\n    if all(results.values()):\n      \
        \  print('Flat White SSH and proxy ports recovered after reboot.')\n     \
        \   break\n    time.sleep(10)\nelse: raise SystemExit('Reboot finished, but\
        \ SSH/proxy ports did not both recover within ten minutes.')\nPY\n"
