name: Create fresh disposable Flat White validation host
jobs:
  deploy:
    name: Create Flat White only; preserve Cream and Decaf
    runs-on: ubuntu-latest
    environment: prod-basic
    env:
      TF_WORKSPACE: flatwhite
      TF_ACTION: apply
      TF_PLAN_DIR: artifacts/terraform
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.TF_BACKEND_REGION || 'ap-southeast-1' }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_aws_profile: default
      TF_VAR_aws_conf_file_path: ~/.aws/config
      TF_VAR_aws_cred_file_path: ~/.aws/credentials
      TF_VAR_ssh_public_key_path: ~/.ssh/jeonkwan-mbp.pub
      TF_VAR_ssh_private_key_path: ~/.ssh/jeonkwan-mbp
      TF_VAR_instance_customizable_name: flatwhite
      TF_VAR_subdomain_name: flatwhite
      TF_VAR_selected_country: singapore
      TF_VAR_selected_zone: a
      TF_VAR_domain_name: mokamaker.site
      TF_VAR_proxy_solution: basic-vm
      TF_VAR_proxy_contact_email: ''
      TF_VAR_playbook_branch: feature/bounded-logs
      TF_VAR_namecheap_ddns_password: ${{ secrets.NAMECHEAP_DDNS_PASS }}
      TF_VAR_proxy_server_uuid: 00000000-0000-4000-8000-000000000000
      TF_VAR_less_vision_reality_short_ids: ${{ secrets.LESS_VISION_REALITY_SHORT_IDS
        || '[]' }}
      TF_VAR_less_vision_reality_private_key: ${{ secrets.LESS_VISION_REALITY_PRIVATE_KEY
        || '' }}
      TF_VAR_less_vision_reality_public_key: ${{ secrets.LESS_VISION_REALITY_PUBLIC_KEY
        || '' }}
      TF_VAR_less_vision_reality_decoy_domain: ${{ secrets.LESS_VISION_REALITY_DECOY_DOMAIN
        || 'web.wechat.com' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || 'ap-southeast-1' }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6
    - name: Bootstrap credentials and backend
      env:
        VARS_CONTEXT: ${{ toJSON(vars) }}
      run: 'chmod +x scripts/deploy-basic/*.sh

        scripts/deploy-basic/bootstrap-env.sh

        '
    - name: Retire only failed first-boot Flat White before clean retest
      run: "set -euo pipefail\naws lightsail get-instances --region ap-southeast-1\
        \ > \"$RUNNER_TEMP/serving-peers.json\"\npython3 - <<'PEERS'\nimport json,os\n\
        items=json.load(open(os.environ['RUNNER_TEMP']+'/serving-peers.json'))['instances']\n\
        for name,ip in {'lightsail-singapore-a-cream-20261004151043':'13.250.199.129','lightsail-singapore-c-decaf-20260730010620':'52.74.81.140'}.items():\n\
        \ x=next(x for x in items if x['name']==name);assert x['publicIpAddress']==ip\
        \ and x['state']['name']=='running';print('Verified serving peer before test-host\
        \ destruction:',name,ip)\nPEERS\nexport TF_VAR_instance_customizable_name=flatwhite\
        \ TF_VAR_subdomain_name=flatwhite TF_VAR_selected_country=singapore TF_VAR_selected_zone=a\
        \ TF_VAR_proxy_solution=basic-vm TF_VAR_domain_name=mokamaker.site\naws lightsail\
        \ get-instance --instance-name lightsail-singapore-a-flatwhite-20261005023816\
        \ --region ap-southeast-1 --query 'instance.{name:name,ip:publicIpAddress,zone:location.availabilityZone}'\
        \ > \"$RUNNER_TEMP/target.json\"\npython3 - <<'CHECK'\nimport json,os\nx=json.load(open(os.environ['RUNNER_TEMP']+'/target.json'));assert\
        \ x=={'name':'lightsail-singapore-a-flatwhite-20261005023816','ip':'3.1.225.76','zone':'ap-southeast-1a'}\n\
        CHECK\nunset TF_WORKSPACE\nterraform init -input=false -backend-config=\"\
        bucket=$TF_BACKEND_BUCKET\" -backend-config=\"key=$TF_BACKEND_KEY\" -backend-config=\"\
        region=$TF_BACKEND_REGION\"\nterraform workspace select flatwhite\nterraform\
        \ plan -destroy -input=false -out=\"$RUNNER_TEMP/retire.tfplan\"\nterraform\
        \ show -json \"$RUNNER_TEMP/retire.tfplan\" > \"$RUNNER_TEMP/retire.json\"\
        \npython3 - <<'CHECK'\nimport os,json\np=json.load(open(os.environ['RUNNER_TEMP']+'/retire.json'));changes=p.get('resource_changes',[]);assert\
        \ len(changes)==6\nexpected={'aws_lightsail_instance','aws_lightsail_static_ip','aws_lightsail_static_ip_attachment','aws_lightsail_instance_public_ports','aws_lightsail_key_pair','null_resource'};seen=set()\n\
        for r in changes:\n assert r['change']['actions']==['delete'];t=r['type'];assert\
        \ t in expected;seen.add(t);b=r['change']['before']\n if t=='aws_lightsail_instance':assert\
        \ b['name']=='lightsail-singapore-a-flatwhite-20261005023816' and b['availability_zone']=='ap-southeast-1a'\n\
        \ elif t=='aws_lightsail_static_ip':assert b['name']=='lightsail-singapore-a-flatwhite-ip'\
        \ and b['ip_address']=='3.1.225.76'\n elif t in ['aws_lightsail_static_ip_attachment','aws_lightsail_instance_public_ports']:assert\
        \ b['instance_name']=='lightsail-singapore-a-flatwhite-20261005023816'\n elif\
        \ t=='aws_lightsail_key_pair':assert b['name']=='key-lightsail-singapore-a-flatwhite'\n\
        \ elif t=='null_resource':assert b['triggers']['subdomain']=='flatwhite'\n\
        \ print('Verified failed test-host deletion:',r['address'])\nassert seen==expected\n\
        CHECK\nterraform apply -input=false \"$RUNNER_TEMP/retire.tfplan\"\n"
    - name: Require unused Flat White name and protect serving peers
      run: "set -euo pipefail\naws lightsail get-instances --region ap-southeast-1\
        \ > \"$RUNNER_TEMP/instances.json\"\naws lightsail get-static-ips --region\
        \ ap-southeast-1 > \"$RUNNER_TEMP/static-ips.json\"\naws lightsail get-blueprints\
        \ --region ap-southeast-1 --include-inactive > \"$RUNNER_TEMP/blueprints.json\"\
        \npython3 - <<'CHECK'\nimport json,os\nr=os.environ['RUNNER_TEMP'];items=json.load(open(r+'/instances.json'))['instances']\n\
        for name,ip in {'lightsail-singapore-a-cream-20261004151043':'13.250.199.129','lightsail-singapore-c-decaf-20260730010620':'52.74.81.140'}.items():\n\
        \ x=next(x for x in items if x['name']==name);assert x['publicIpAddress']==ip\
        \ and x['state']['name']=='running';print('Protected peer:',name,ip)\nassert\
        \ not any('flatwhite' in x['name'] for x in items)\nassert not any(x['name']=='lightsail-singapore-a-flatwhite-ip'\
        \ for x in json.load(open(r+'/static-ips.json'))['staticIps'])\nb=next(b for\
        \ b in json.load(open(r+'/blueprints.json'))['blueprints'] if b['blueprintId']=='ubuntu_24_04');assert\
        \ b['isActive'];print('Current blueprint:',{k:b.get(k) for k in ['blueprintId','name','version','versionCode']})\n\
        CHECK\ncat >> \"$GITHUB_ENV\" <<'CONFIG'\nTF_WORKSPACE=flatwhite\nTF_ACTION=apply\n\
        TF_VAR_instance_customizable_name=flatwhite\nTF_VAR_subdomain_name=flatwhite\n\
        TF_VAR_selected_country=singapore\nTF_VAR_selected_zone=a\nTF_VAR_domain_name=mokamaker.site\n\
        TF_VAR_proxy_solution=basic-vm\nTF_VAR_playbook_branch=feature/bounded-logs\n\
        CONFIG\n"
    - name: Plan creation in empty isolated workspace
      run: "set -euo pipefail\nunset TF_WORKSPACE\nterraform init -input=false -backend-config=\"\
        bucket=$TF_BACKEND_BUCKET\" -backend-config=\"key=$TF_BACKEND_KEY\" -backend-config=\"\
        region=$TF_BACKEND_REGION\"\nterraform workspace select -or-create flatwhite\n\
        mkdir -p artifacts/terraform\nterraform state pull > artifacts/terraform/preflight-state.json\n\
        python3 - <<'CHECK'\nimport json\ns=json.load(open('artifacts/terraform/preflight-state.json'));assert\
        \ not any(r.get('instances') for r in s.get('resources',[]) if r.get('mode')=='managed'),'Flat\
        \ White workspace is not empty'\nCHECK\nterraform plan -input=false -out=artifacts/terraform/terraform.tfplan\n\
        terraform show -json artifacts/terraform/terraform.tfplan > artifacts/terraform/plan.json\n\
        python3 - <<'CHECK'\nimport json\np=json.load(open('artifacts/terraform/plan.json'));changes=p.get('resource_changes',[]);assert\
        \ len(changes)==6\nfor r in changes:\n assert r['change']['actions']==['create'],r['address'];a=r['change']['after'];print('Verified\
        \ new resource:',r['address'])\n if r['type']=='aws_lightsail_instance':\n\
        \  assert a['availability_zone']=='ap-southeast-1a' and a['blueprint_id']=='ubuntu_24_04'\
        \ and a['bundle_id']=='nano_2_0'\n  assert a['key_pair_name']=='key-lightsail-singapore-a-flatwhite'\n\
        \ elif r['type']=='aws_lightsail_static_ip':assert a['name']=='lightsail-singapore-a-flatwhite-ip'\n\
        \ elif r['type']=='aws_lightsail_key_pair':assert a['name']=='key-lightsail-singapore-a-flatwhite'\n\
        \ elif r['type']=='null_resource':assert a['triggers']['subdomain']=='flatwhite'\n\
        CHECK\n"
    - name: Apply verified creation plan
      run: terraform apply -input=false artifacts/terraform/terraform.tfplan
    - name: Record Flat White identity and check protected peers
      run: "set -euo pipefail\naws lightsail get-instances --region ap-southeast-1\
        \ > \"$RUNNER_TEMP/after.json\"\npython3 - <<'CHECK'\nimport os,json\nitems=json.load(open(os.environ['RUNNER_TEMP']+'/after.json'))['instances']\n\
        for name,ip in {'lightsail-singapore-a-cream-20261004151043':'13.250.199.129','lightsail-singapore-c-decaf-20260730010620':'52.74.81.140'}.items():\n\
        \ x=next(x for x in items if x['name']==name);assert x['publicIpAddress']==ip\
        \ and x['state']['name']=='running';print('Preserved peer:',name,ip)\nf=[x\
        \ for x in items if x['name'].startswith('lightsail-singapore-a-flatwhite-')];assert\
        \ len(f)==1\nx=f[0];print('NEW_FLATWHITE_IDENTITY',json.dumps({k:x.get(k)\
        \ for k in ['name','publicIpAddress','blueprintId','bundleId','location']}))\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as w:w.write('Fresh Flat\
        \ White: '+x['name']+' / '+x['publicIpAddress']+'\\n')\nCHECK\n"
    timeout-minutes: 25
'on':
  workflow_dispatch: {}
run-name: Recreate Flat White for clean corrected bootstrap test
concurrency:
  group: flatwhite-disposable-test
  cancel-in-progress: false
