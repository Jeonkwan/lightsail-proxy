name: Reboot cream through Lightsail API
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightsail-cream-recovery
  cancel-in-progress: false
jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod-basic
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - name: Install AWS SDK
        run: python3 -m pip install boto3
      - name: Validate cream identity, collect status and reboot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import boto3,datetime,json,socket,time
          client=boto3.client('lightsail',region_name='ap-southeast-1')
          name='lightsail-singapore-a-cream-20261002012159'
          expected_ip='54.254.18.227'
          instance=client.get_instance(instanceName=name)['instance']
          print('Instance:',instance['name'],'State:',instance['state']['name'],'IP:',instance.get('publicIpAddress'))
          if instance['name']!=name or instance.get('publicIpAddress')!=expected_ip:
              raise SystemExit('Instance identity/IP differs from verified cream deployment; refusing reboot.')
          if instance['state']['name']!='running':
              raise SystemExit('Cream is not running; refusing to perform an unexpected start/stop operation.')
          print('Instance status:',json.dumps(client.get_instance_state(instanceName=name)['state']))
          try:
              ports=client.get_instance_port_states(instanceName=name)['portStates']
              print('Public firewall port states:',json.dumps(ports))
          except Exception as e:
              print('Firewall read unavailable:',type(e).__name__)
          try:
              end=datetime.datetime.now(datetime.timezone.utc)
              metrics=client.get_instance_metric_data(instanceName=name,metricName='CPUUtilization',period=300,
                  startTime=end-datetime.timedelta(hours=24),endTime=end,unit='Percent',statistics=['Average','Maximum'])['metricData']
              print('Recent CPU metrics:',json.dumps(metrics[-12:],default=str))
          except Exception as e:
              print('Metric read unavailable:',type(e).__name__)
          for port in (22,443):
              try:
                  with socket.create_connection((expected_ip,port),timeout=5): pass
                  print('Before reboot TCP',port,'PASS')
              except OSError as e: print('Before reboot TCP',port,'FAIL',str(e))
          result=client.reboot_instance(instanceName=name)
          for operation in result['operations']:
              print('Reboot operation:',operation['id'],operation['status'])
              for attempt in range(60):
                  current=client.get_operation(operationId=operation['id'])['operation']
                  if current.get('isTerminal'):
                      print('Reboot terminal result:',json.dumps(current,default=str))
                      if current['status'] not in ('Succeeded','Completed'):
                          raise SystemExit('AWS reboot operation failed.')
                      break
                  time.sleep(2)
              else: raise SystemExit('AWS reboot operation did not finish within two minutes.')
          deadline=time.monotonic()+300
          time.sleep(15)
          while time.monotonic()<deadline:
              results={}
              for port in (22,443):
                  try:
                      with socket.create_connection((expected_ip,port),timeout=3): pass
                      results[port]=True
                  except OSError: results[port]=False
              print('Post-reboot TCP checks:',results,flush=True)
              if all(results.values()):
                  print('Cream SSH and proxy ports recovered after reboot.')
                  break
              time.sleep(10)
          else: raise SystemExit('Reboot finished, but SSH/proxy ports did not both recover within five minutes.')
          PY
