name: Guarded new Cream API diagnostics
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        default: inspect
        options: [inspect, reboot]
permissions:
  contents: read
concurrency:
  group: guarded-new-cream-api
  cancel-in-progress: false
jobs:
  cream:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: prod-basic
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
      ACTION: ${{ inputs.action }}
    steps:
    - name: Install AWS SDK
      run: python3 -m pip install boto3
    - name: Inspect guarded new Cream or reboot it
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import boto3,datetime,json,socket,time,os
        c=boto3.client('lightsail',region_name='ap-southeast-1')
        name='lightsail-singapore-a-cream-20261004151043'
        ip='13.250.199.129'
        x=c.get_instance(instanceName=name)['instance']
        assert x['name']==name and x.get('publicIpAddress')==ip and x['location']['availabilityZone']=='ap-southeast-1a'
        print('Guarded Cream:',json.dumps({k:x.get(k) for k in ['name','state','publicIpAddress','blueprintId','bundleId','location']}),flush=True)
        print('Firewall:',json.dumps(c.get_instance_port_states(instanceName=name)['portStates']),flush=True)
        for n,p in [('flatwhite','54.251.241.201'),('decaf','52.74.81.140')]:
            hosts=[i for i in c.get_instances()['instances'] if i['name'].startswith('lightsail-') and '-'+n+'-' in i['name']]
            assert len(hosts)==1 and hosts[0]['publicIpAddress']==p and hosts[0]['state']['name']=='running'
            print('Existing control unchanged:',n,p,flush=True)
        end=datetime.datetime.now(datetime.timezone.utc)
        for metric,unit in [('CPUUtilization','Percent'),('BurstCapacityPercentage','Percent'),('StatusCheckFailed','Count')]:
            try:
                points=c.get_instance_metric_data(instanceName=name,metricName=metric,period=300,startTime=end-datetime.timedelta(hours=1),endTime=end,unit=unit,statistics=['Average','Maximum'])['metricData']
                print(metric,json.dumps(points[-12:],default=str),flush=True)
            except Exception as e: print(metric,type(e).__name__,flush=True)
        def ports():
            results={}
            for port in (22,443):
                try:
                    with socket.create_connection((ip,port),timeout=3): pass
                    results[port]=True
                except OSError: results[port]=False
            print('TCP checks:',results,flush=True)
            return results
        ports()
        if os.environ['ACTION']=='reboot':
            assert x['state']['name']=='running'
            r=c.reboot_instance(instanceName=name)
            for op in r['operations']:
                for _ in range(60):
                    o=c.get_operation(operationId=op['id'])['operation']
                    if o.get('isTerminal'):
                        print('AWS reboot result:',json.dumps(o,default=str),flush=True)
                        assert o['status'] in ('Succeeded','Completed')
                        break
                    time.sleep(2)
                else: raise SystemExit('AWS operation did not complete')
            time.sleep(20)
            for _ in range(40):
                if ports()[22]: break
                time.sleep(10)
            else: raise SystemExit('SSH failed to recover after API reboot; no kernel rollback attempted')
        PY
