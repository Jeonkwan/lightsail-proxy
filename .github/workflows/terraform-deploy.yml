name: Native Xray infrastructure operations
run-name: 'Native infrastructure: ${{ inputs.operation }} ${{ inputs.target }}'
'on':
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
        - cream
        - flatwhite
        required: true
        default: cream
      operation:
        type: choice
        options:
        - inspect
        - authorize
        - create
        - replace
        - destroy
        required: true
        default: inspect
      public_key:
        type: string
        required: false
        default: ""
        description: Public deployment key for selected test host
      expected_instance:
        type: string
        required: false
        default: ''
        description: Exact instance name required for replace/destroy
concurrency:
  group: native-infra-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    environment: prod-basic
    timeout-minutes: 25
    env:
      TF_WORKSPACE: ${{ inputs.target }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_aws_profile: default
      TF_VAR_aws_conf_file_path: ~/.aws/config
      TF_VAR_aws_cred_file_path: ~/.aws/credentials
      TF_VAR_ssh_public_key_path: ~/.ssh/jeonkwan-mbp.pub
      TF_VAR_ssh_private_key_path: ~/.ssh/jeonkwan-mbp
      TF_VAR_instance_customizable_name: ${{ inputs.target }}
      TF_VAR_subdomain_name: ${{ inputs.target }}
      TF_VAR_selected_country: singapore
      TF_VAR_selected_zone: a
      TF_VAR_domain_name: mokamaker.site
      TF_VAR_proxy_solution: basic-vm
      TF_VAR_playbook_branch: feature/native-xray
      TF_VAR_namecheap_ddns_password: ${{ secrets.NAMECHEAP_DDNS_PASS }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || 'ap-southeast-1' }}
      TARGET: ${{ inputs.target }}
      OPERATION: ${{ inputs.operation }}
      PUBLIC_KEY: ${{ inputs.public_key }}
      EXPECTED_INSTANCE: ${{ inputs.expected_instance }}
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6
    - name: Configure credentials and isolated backend
      env:
        VARS_CONTEXT: ${{ toJSON(vars) }}
      run: bash scripts/deploy-basic/bootstrap-env.sh
    - name: Inspect and operate only selected resources
      run: python3 scripts/native-infrastructure.py
